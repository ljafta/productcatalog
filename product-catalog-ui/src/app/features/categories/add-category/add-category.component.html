<h2 class="mb-4">Add Category</h2>

<!-- Error message -->
<div *ngIf="error" class="error mb-4">
  {{ error }}
</div>

<form (ngSubmit)="save()" #form="ngForm">

  <div class="form-group">
    <label for="name">Name</label>
    <input
      id="name"
      type="text"
      name="name"
      [(ngModel)]="model.name"
      required
    />
  </div>

  <div class="form-group">
    <label for="description">Description</label>
    <textarea
      id="description"
      name="description"
      [(ngModel)]="model.description">
    </textarea>
  </div>

  <div class="form-group">
    <label for="parentCategoryId">Parent Category</label>
    <select
      id="parentCategoryId"
      name="parentCategoryId"
      [(ngModel)]="model.parentCategoryId">
      <option [ngValue]="null">None (Root)</option>
      <option *ngFor="let c of categories" [ngValue]="c.id">
        {{ c.name }}
      </option>
    </select>
  </div>

  <button type="submit">Save Category</button>
</form>
