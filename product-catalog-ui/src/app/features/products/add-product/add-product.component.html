<h2 class="mb-4">Add Product</h2>

<!-- Error message -->
<div *ngIf="error" class="error mb-4">
  {{ error }}
</div>

<form (ngSubmit)="save()" #form="ngForm">

  <!-- Product Name -->
  <div class="form-group">
    <label for="name">Name</label>
    <input
      id="name"
      name="name"
      [(ngModel)]="model.name"
      required
      placeholder="Enter product name"
    />
  </div>

  <!-- Description -->
  <div class="form-group">
    <label for="description">Description</label>
    <textarea
      id="description"
      name="description"
      [(ngModel)]="model.description"
      rows="3"
      placeholder="Optional description">
    </textarea>
  </div>

  <!-- SKU -->
  <div class="form-group">
    <label for="sku">SKU</label>
    <input
      id="sku"
      name="sku"
      [(ngModel)]="model.sku"
      required
      placeholder="Stock keeping unit"
    />
  </div>

  <!-- Price -->
  <div class="form-group">
    <label for="price">Price</label>
    <input
      id="price"
      type="number"
      name="price"
      [(ngModel)]="model.price"
      required
      min="0"
      step="0.01"
    />
  </div>

  <!-- Quantity -->
  <div class="form-group">
    <label for="quantity">Quantity</label>
    <input
      id="quantity"
      type="number"
      name="quantity"
      [(ngModel)]="model.quantity"
      required
      min="0"
    />
  </div>

  <!-- Category -->
  <div class="form-group">
    <label for="categoryId">Category</label>
    <select
      id="categoryId"
      name="categoryId"
      [(ngModel)]="model.categoryId"
      required>

      <option value="">
        -- Select category --
      </option>

      <option *ngFor="let c of categories" [ngValue]="c.id">
        {{ c.name }}
      </option>
    </select>
  </div>

  <!-- Submit -->
  <button
    type="submit"
    [disabled]="saving || form.invalid">
    {{ saving ? 'Saving…' : 'Save Product' }}
  </button>

</form>
